<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cadastro de Pessoas</h1>

    <form id="pessoa-form">
      <input type="hidden" id="pessoa-id">

      <div class="input-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome" required>
      </div>

      <div class="input-group">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Digite a idade" required min="0">
      </div>

      <button type="submit" id="btn-salvar">Salvar</button>
    </form>

    <h2>Lista de Cadastrados</h2>
    <ul id="lista-pessoas"></ul>
  </div>

  <!-- Carrega apenas o main.js (que importa o crud.js automaticamente) -->
  <script type="module" src="main.js"></script>
</body>
</html>
